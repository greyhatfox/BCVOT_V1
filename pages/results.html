<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>SWEVOT – Live Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/styles.css"/>
</head>
<body>

<nav>
  <div class="nav-brand">BLOCKCHAIN <span>VOTING</span> SYSTEM V2</div>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="ballots.html">Ballots</a>
    <a href="history.html">History</a>
    <a href="results.html" class="active">Live Results</a>
  </div>
  <div class="nav-user">
    <div class="nav-dot"></div>
    <div>
      <div class="nav-username" id="nav-name">VOTER</div>
      <div class="verified-badge">● VERIFIED</div>
    </div>
    <div class="nav-avatar" id="nav-avatar">?</div>
  </div>
</nav>

<div style="display:flex;flex:1;">
  <div class="sidebar">
    <a href="dashboard.html" class="sidebar-icon" title="Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span class="sidebar-label">Dashboard</span>
    </a>
    <a href="ballots.html" class="sidebar-icon" title="Ballots">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span class="sidebar-label">Ballots</span>
    </a>
    <a href="history.html" class="sidebar-icon" title="History">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="sidebar-label">History</span>
    </a>
    <a href="results.html" class="sidebar-icon active" title="Live Results">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="sidebar-label">Live Results</span>
    </a>
    <div class="sidebar-divider"></div>
    <a href="admin.html" class="sidebar-icon" id="admin-sb" style="display:none" title="Admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 4.5v5c0 5-4 9.5-9 11-5-1.5-9-6-9-11V6.5z"/></svg>
      <span class="sidebar-label">Admin</span>
    </a>
  </div>

  <div class="main-content">
    <div class="top-row">
      <div class="page-title">PUBLIC RESULTS &amp; TRANSPARENCY</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="nav-dot" style="animation:pulse 1.5s infinite"></div>
        <span style="font-size:0.8rem;color:var(--text3);font-weight:600" id="live-label">LIVE</span>
      </div>
    </div>

    <div class="results-grid">
      <div>
        <div class="card" style="margin-bottom:20px">
          <div class="card-body">
            <div class="chart-title" id="chart-title">Loading election…</div>
            <div class="bar-chart" id="bar-chart" style="min-height:140px">
              <div style="margin:auto;font-size:0.8rem;color:var(--text3)">Loading…</div>
            </div>
            <div class="bar-labels" id="bar-labels"></div>
            <div class="leading-note" id="leading-note" style="margin-top:12px"></div>
            <div class="results-stats">
              <div class="stat-box">
                <div class="stat-val" id="stat-total">—</div>
                <div class="stat-lbl">Total Votes Cast</div>
              </div>
              <div class="stat-box">
                <div class="stat-val" id="stat-candidates">—</div>
                <div class="stat-lbl">Candidates</div>
              </div>
              <div class="stat-box">
                <div class="stat-val" id="stat-status">—</div>
                <div class="stat-lbl">Election Status</div>
              </div>
              <div class="stat-box">
                <div class="stat-val">0.0</div>
                <div class="stat-lbl">Anomalies Found</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- candidate breakdown -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">Candidate Breakdown</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
        </div>
        <div class="card-body" style="padding:16px">
          <div id="breakdown-list">
            <div style="text-align:center;color:var(--text3);padding:20px;font-size:0.8rem">Loading…</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}</style>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/blockchain.js"></script>
<script>
  const COLORS = ['linear-gradient(180deg,var(--primary),var(--accent2))','#94a3b8','#7c8fa6','#647285','#4e5a65'];

  async function init() {
    const addr = await BC.reconnect();
    if (addr) {
      try {
        const v = await BC.getVoter(addr);
        if (v.registered) {
          document.getElementById('nav-name').textContent = v.name.toUpperCase();
          document.getElementById('nav-avatar').textContent = v.name.slice(0,2).toUpperCase();
        }
        if (await BC.isAdmin()) document.getElementById('admin-sb').style.display = 'flex';
      } catch {}
    }
    if (!BC.isDeployed()) { showNoContract(); return; }
    await loadResults();
    setInterval(loadResults, 8000); // poll every 8s
  }

  async function loadResults() {
    try {
      const [candidates, total, election, live] = await Promise.all([
        BC.getCandidates(),
        BC.getTotalVotes(),
        BC.getElection(),
        BC.isElectionLive()
      ]);

      const approved = candidates.filter(c => c.approved);
      document.getElementById('chart-title').textContent = election.title;
      document.getElementById('stat-total').textContent = total.toLocaleString();
      document.getElementById('stat-candidates').textContent = approved.length;
      document.getElementById('stat-status').textContent = live ? 'LIVE' : 'ENDED';
      document.getElementById('live-label').textContent = live ? 'LIVE' : 'ENDED';

      renderBars(approved, total);
      renderBreakdown(approved, total);
      renderLeading(approved);
    } catch(e) {
      console.error('Results error:', e);
    }
  }

  function renderBars(candidates, total) {
    const chart = document.getElementById('bar-chart');
    const labels = document.getElementById('bar-labels');
    if (!candidates.length) {
      chart.innerHTML = '<div style="margin:auto;font-size:0.8rem;color:var(--text3)">No candidates yet</div>';
      return;
    }
    chart.innerHTML = '';
    labels.innerHTML = '';
    candidates.forEach((c, i) => {
      const pct = total > 0 ? Math.round(Number(c.voteCount) / total * 100) : 0;
      const h = Math.max(pct, 2);
      const col = document.createElement('div');
      col.className = 'bar-col';
      col.innerHTML = `<div class="bar-val">${pct}%</div><div class="bar" style="height:${h}%;background:${COLORS[i % COLORS.length]}"></div>`;
      chart.appendChild(col);
      const lbl = document.createElement('div');
      lbl.className = 'bar-label';
      lbl.textContent = c.name.split(' ')[0];
      labels.appendChild(lbl);
    });
  }

  function renderBreakdown(candidates, total) {
    const list = document.getElementById('breakdown-list');
    if (!candidates.length) { list.innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px;font-size:0.8rem">No candidates yet</div>'; return; }
    const sorted = [...candidates].sort((a,b) => Number(b.voteCount) - Number(a.voteCount));
    list.innerHTML = sorted.map((c,i) => {
      const pct = total > 0 ? Math.round(Number(c.voteCount) / total * 100) : 0;
      const col = i === 0 ? 'linear-gradient(90deg,var(--primary),var(--accent))' : '#94a3b8';
      return `<div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-size:0.78rem;margin-bottom:4px">
          <span style="font-weight:600">${c.emoji} ${c.name}</span>
          <span style="color:var(--text3)">${pct}% · ${Number(c.voteCount).toLocaleString()} votes</span>
        </div>
        <div style="background:var(--border);border-radius:20px;height:6px">
          <div style="background:${col};height:100%;border-radius:20px;width:${pct}%;transition:width .6s"></div>
        </div>
        <div style="font-size:0.72rem;color:var(--text3);margin-top:2px">${c.party}</div>
      </div>`;
    }).join('');
  }

  function renderLeading(candidates) {
    if (!candidates.length) return;
    const top = [...candidates].sort((a,b) => Number(b.voteCount) - Number(a.voteCount))[0];
    document.getElementById('leading-note').innerHTML = `📊 <strong>${top.name}</strong> (${top.party}) leading`;
  }

  function showNoContract() {
    document.getElementById('chart-title').textContent = 'Contract not deployed';
    document.getElementById('stat-total').textContent = '—';
    document.getElementById('breakdown-list').innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px;font-size:0.8rem">Deploy contract first — see DEPLOY.md</div>';
  }

  init();
</script>
</body>
</html>
