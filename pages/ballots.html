<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>SWEVOT – Ballots</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/styles.css"/>
</head>
<body>

<nav>
  <div class="nav-brand">BLOCKCHAIN <span>VOTING</span> SYSTEM V2</div>
  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="ballots.html" class="active">Ballots</a>
    <a href="history.html">History</a>
    <a href="results.html">Live Results</a>
  </div>
  <div class="nav-user">
    <div class="nav-dot"></div>
    <div><div class="nav-username" id="nav-name">VOTER</div><div class="verified-badge">● VERIFIED</div></div>
    <div class="nav-avatar" id="nav-avatar">?</div>
  </div>
</nav>

<div style="display:flex;flex:1;">
  <div class="sidebar">
    <a href="dashboard.html" class="sidebar-icon" title="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span class="sidebar-label">Dashboard</span></a>
    <a href="ballots.html" class="sidebar-icon active" title="Ballots"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="sidebar-label">Ballots</span></a>
    <a href="history.html" class="sidebar-icon" title="History"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="sidebar-label">History</span></a>
    <a href="results.html" class="sidebar-icon" title="Live Results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span class="sidebar-label">Live Results</span></a>
    <div class="sidebar-divider"></div>
  </div>

  <div class="main-content">
    <div class="page-title">BALLOTS</div>
    <div id="ballots-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px">
      <div style="color:var(--text3);padding:20px;font-size:0.85rem">Loading…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.9.0/dist/ethers.umd.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/blockchain.js"></script>
<script>
  async function init() {
    const addr = await BC.reconnect();
    if (!addr) { window.location.href = 'auth.html'; return; }
    try {
      const v = await BC.getVoter(addr);
      if (v.registered) {
        document.getElementById('nav-name').textContent = v.name.toUpperCase();
        document.getElementById('nav-avatar').textContent = v.name.slice(0,2).toUpperCase();
      }
      const [el, live, cands, total] = await Promise.all([BC.getElection(), BC.isElectionLive(), BC.getCandidates(), BC.getTotalVotes()]);
      const approved = cands.filter(c => c.approved);
      const end = new Date(Number(el.endTime) * 1000);
      const grid = document.getElementById('ballots-grid');
      grid.innerHTML = `
        <div class="card">
          <div class="card-header">
            <span class="card-title">${el.title}</span>
            <span class="status-badge" style="background:${live?'rgba(6,214,160,0.1)':'rgba(160,174,192,0.1)'};color:${live?'var(--accent)':'var(--text3)'};border:1px solid ${live?'rgba(6,214,160,0.3)':'var(--border)'};font-size:0.7rem">${live?'ACTIVE':'ENDED'}</span>
          </div>
          <div class="card-body">
            <div style="font-size:0.82rem;color:var(--text3);margin-bottom:10px">Constituency Election · Sepolia ETH</div>
            <div style="font-size:0.78rem;color:var(--text2);margin-bottom:6px">Candidates: <strong>${approved.length}</strong> &nbsp;|&nbsp; Ends: <strong>${end.toLocaleDateString()}</strong></div>
            <div style="font-size:0.78rem;color:var(--text2);margin-bottom:14px">Total Votes Cast: <strong>${total.toLocaleString()}</strong></div>
            <div style="display:flex;flex-direction:column;gap:8px">
              ${approved.map(c=>`<div style="display:flex;align-items:center;gap:8px;font-size:0.8rem"><span>${c.emoji}</span><span style="font-weight:600">${c.name}</span><span style="color:var(--text3)">${c.party}</span></div>`).join('')}
            </div>
            ${v.hasVoted
              ? '<div style="margin-top:16px;padding:10px;background:rgba(6,214,160,0.08);border:1px solid rgba(6,214,160,0.2);border-radius:8px;font-size:0.8rem;color:var(--accent);text-align:center">✅ You have already voted in this election</div>'
              : `<button class="cast-vote-btn" style="margin-top:16px" onclick="location.href='dashboard.html'">GO TO BALLOT →</button>`
            }
          </div>
        </div>`;
    } catch(e) {
      document.getElementById('ballots-grid').innerHTML = `<div style="color:var(--text3);font-size:0.82rem">Error: ${e.reason||e.message}</div>`;
    }
  }
  init();
</script>
</body>
</html>
