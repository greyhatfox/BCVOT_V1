    <a href="ballots.html" class="sidebar-icon active" title="Ballots">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>

  <div class="main-content">
    <div class="page-title">BALLOTS</div>

    <!-- Elections grid — populated by JS below -->
    <div id="elections-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px">
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text3);font-size:0.85rem">

<!-- Script load order -->
<script src="../js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/script.js"></script>
<script>
// ── Load elections from Supabase ────────────────────────────
(async function loadElections() {
  const db   = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
  const grid = document.getElementById('elections-grid');

  // Fetch elections (simple query — no join)
  const { data: elections, error } = await db
    .from('elections')
    .select('*')
    .order('id', { ascending: true });

  if (error || !elections || elections.length === 0) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text3)">
      No elections found. Please run the seed SQL in Supabase.<br>
      <small style="color:var(--danger);font-family:monospace;font-size:0.75rem">${error ? error.message : 'Empty table'}</small>
    </div>`;
    return;
  }

  // Fetch candidate counts separately per election
  const { data: candidateRows } = await db
    .from('candidates')
    .select('election_id');

  const countMap = {};
  (candidateRows || []).forEach(c => {
    countMap[c.election_id] = (countMap[c.election_id] || 0) + 1;
  });

  grid.innerHTML = '';
  elections.forEach(el => {
    const isActive       = el.status === 'active';
    const endDate        = el.end_date ? new Date(el.end_date).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : '—';
    const candidateCount = countMap[el.id] ?? 0;

    const card = document.createElement('div');
    card.className = 'card';
    if (!isActive) card.style.opacity = '0.6';

    card.innerHTML = `
      <div class="card-header">
        <span class="card-title">${el.title.split('·')[0].trim()}</span>
        <span class="status-badge" style="${isActive
          ? 'background:rgba(6,214,160,0.1);color:var(--accent);border:1px solid rgba(6,214,160,0.3);font-size:0.7rem'
          : 'background:rgba(160,174,192,0.12);color:var(--text3);border:1px solid var(--border);font-size:0.7rem'
        }">${isActive ? 'ACTIVE' : 'CLOSED'}</span>
      </div>
      <div class="card-body">
        <div style="font-size:0.82rem;color:var(--text3);margin-bottom:14px">${el.title.split('·').slice(1).join('·').trim() || 'General'}</div>
        <div style="font-size:0.78rem;color:var(--text2);margin-bottom:${isActive ? '8px' : '0'}">
          Candidates: <strong>${candidateCount}</strong> &nbsp;|&nbsp;
          ${isActive ? `Ends: <strong>${endDate}</strong>` : `Ended: <strong>${endDate}</strong>`}
        </div>
        ${isActive
          ? `<button class="cast-vote-btn" style="margin-top:8px" onclick="location.href='dashboard.html'">GO TO BALLOT →</button>`
          : `<div style="font-size:0.78rem;color:var(--text2);margin-top:4px">Voted · Results Published</div>`
        }
      </div>`;
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
