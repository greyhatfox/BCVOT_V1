<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blockchain Voting System V2 – Auth</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<nav>
  <div class="nav-brand">BLOCKCHAIN <span>VOTING</span> SYSTEM V2</div>
  <div class="nav-links">
    <a href="dashboard.html" id="nav-dashboard">Dashboard</a>
    <a href="ballots.html" id="nav-ballots">Ballots</a>
    <a href="history.html" id="nav-history">History</a>
    <a href="results.html" id="nav-results">Live Results</a>
    <a href="auth.html" id="nav-auth" class="active" style="color:rgba(255,255,255,0.35); font-size:0.8rem;">Auth Demo</a>
  </div>
  <div class="nav-user">
    <div class="nav-dot"></div>
    <div>
      <div class="nav-username">ROHAN SINGH</div>
      <div class="verified-badge">● VERIFIED</div>
    </div>
    <div class="nav-avatar">RS</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 1 0 4.93 19.07"/></svg>
  </div>
</nav>

<div style="flex:1;background:linear-gradient(135deg,#e8f4f8,#f0f8fc,#e8f0f8);display:flex;">
  <div class="auth-page" style="flex:1">
    <div class="auth-card">
      <div class="auth-title">Identity Verification</div>
      <div class="auth-sub">Verify using your 12-Digit Aadhaar number to access the voting system.</div>

      <div class="input-group">
        <label class="input-label">12-Digit Aadhaar</label>
        <input type="text" class="input-field" placeholder="XXXX-XXXX-XXXX" maxlength="14" id="aadhaar-input" oninput="formatAadhaar(this)" />
      </div>

      <div class="fingerprint-section">
        <div class="fingerprint-ring">
          <div class="fp-icon">🖐</div>
        </div>
        <div class="fp-label">Biometric Authentication<br><span style="color:var(--primary);font-weight:600">Place finger on sensor</span></div>
      </div>

      <button class="auth-btn" onclick="doAuth()">VERIFY &amp; CONTINUE</button>

      <div class="uidai-note">
        🔒 Secured by <strong>UIDAI</strong> · Identity Verification (Aadhaar)
      </div>
    </div>
  </div>
</div>

<script src="../js/script.js"></script>
</body>
</html>
